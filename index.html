<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海外财务BP管理体系建设｜项目看板</title>
<style>body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f6f8fb;color:#17345f}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:16px}.err{max-width:760px;margin:80px auto;padding:24px;background:#fff;border:1px solid #ddd;border-radius:12px;line-height:1.7}</style>
</head>
<body><div class="loading">正在加载项目看板…</div>
<script>
(async()=>{
  try{
    const parts=await Promise.all([1,2,3,4,5].map(async i=>{
      const r=await fetch(`payload-${i}.txt`,{cache:'no-store'});
      if(!r.ok) throw new Error(`payload-${i}.txt 加载失败`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('当前浏览器不支持页面解压，请使用最新版 Chrome / Edge / Safari');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=new TextDecoder().decode(await new Response(stream).arrayBuffer());
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML=`<div class="err"><b>看板加载失败</b><br>${String(e.message||e)}<br><br>请刷新页面，或使用最新版 Chrome / Edge 浏览器。</div>`;
  }
})();
</script>
</body>
</html>
